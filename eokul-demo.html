<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-Okul Demo | Sahte Veri</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #eef3f7;
            color: #4a5568;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .mobile-container {
            width: 100%;
            max-width: 450px;
            background-color: #eef3f7;
            position: relative;
            padding-bottom: 30px;
            overflow-x: hidden;
        }

        .demo-banner {
            position: relative;
            z-index: 3;
            background: #744210;
            color: #fffbeb;
            text-align: center;
            padding: 10px 14px;
            font-size: 12px;
            font-weight: 700;
            line-height: 1.45;
        }

        .demo-banner a {
            color: #fef3c7;
        }

        .top-header-bg {
            background: linear-gradient(135deg, #319795, #2b6cb0);
            height: 120px;
            border-bottom-left-radius: 50% 20px;
            border-bottom-right-radius: 50% 20px;
            position: absolute;
            top: 52px;
            left: 0;
            right: 0;
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            padding: 20px 15px;
            margin-top: 62px;
        }

        .sample-chip {
            background: rgba(255,255,255,0.95);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 15px;
            font-size: 13px;
            color: #2d3748;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .sample-chip strong {
            display: block;
            font-size: 15px;
            margin-bottom: 2px;
        }

        .card-grid {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            margin-bottom: 15px;
            overflow: hidden;
        }

        .grid-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 8px;
            border-right: 1px solid #f0f4f8;
            border-bottom: 1px solid #f0f4f8;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
            background: none;
            width: 100%;
        }

        .grid-item:nth-child(3n) {
            border-right: none;
        }

        .grid-item:nth-child(n+4) {
            border-bottom: none;
        }

        .grid-item:hover,
        .grid-item:active {
            background-color: #f7fafc;
        }

        .icon-box {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            font-size: 24px;
            color: #3182ce;
            background-color: #ebf8ff;
        }

        .grid-item span {
            font-size: 13px;
            font-weight: 600;
            color: #4a5568;
            line-height: 1.2;
        }

        .card-list {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 15px;
            overflow: hidden;
        }

        .list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid #f0f4f8;
            cursor: pointer;
            transition: background 0.2s;
            background: none;
            width: 100%;
            text-align: left;
        }

        .list-item:last-child {
            border-bottom: none;
        }

        .list-item:hover,
        .list-item:active {
            background-color: #f7fafc;
        }

        .list-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .list-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: #f7fafc;
            border: 1px solid #edf2f7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #4a5568;
        }

        .list-item span {
            font-size: 15px;
            font-weight: 500;
            color: #4a5568;
        }

        .chevron {
            color: #cbd5e0;
            font-size: 18px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin: 8px 15px 0;
            color: #2b6cb0;
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 400px;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 20px;
            color: #a0aec0;
            cursor: pointer;
            background: none;
            border: none;
        }

        .grade-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .grade-table th, .grade-table td {
            padding: 10px;
            border-bottom: 1px solid #edf2f7;
            text-align: left;
            font-size: 14px;
        }

        .grade-table th {
            background-color: #f7fafc;
            color: #718096;
        }

        .fake-note {
            font-size: 12px;
            color: #c05621;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <div class="demo-banner">
            DEMO / SAHTE VERİ — Bu sayfa resmi e-Okul değildir. Giriş, TC veya şifre istenmez.
        </div>
        <div class="top-header-bg"></div>

        <div class="content">
            <div class="sample-chip">
                <strong>Örnek öğrenci (uydurma)</strong>
                Ad Soyad gösterilmez · T.C. kimlik no yok · Şifre yok
            </div>

            <div class="card-grid">
                <button type="button" class="grid-item" onclick="showGradeModal()">
                    <div class="icon-box"><i class="fa-regular fa-clipboard"></i></div>
                    <span>Not Bilgileri</span>
                </button>
                <button type="button" class="grid-item" onclick="showModal('Devamsızlık Bilgileri', 'Örnek kayıt: Toplam devamsızlık 0 gün (sahte veri).')">
                    <div class="icon-box"><i class="fa-solid fa-clock"></i></div>
                    <span>Devamsızlık Bilgileri</span>
                </button>
                <button type="button" class="grid-item" onclick="showModal('Ders Programı', 'Örnek metin: Ders programı bu demoda sabit bir açıklamadır.')">
                    <div class="icon-box"><i class="fa-regular fa-calendar-days"></i></div>
                    <span>Ders Programı</span>
                </button>
                <button type="button" class="grid-item" onclick="showModal('Sınav Tarihleri', 'Örnek metin: Yazılı tarihleri bu demoda açıklanmamış görünür.')">
                    <div class="icon-box"><i class="fa-regular fa-calendar-check"></i></div>
                    <span>Sınav Tarihleri</span>
                </button>
                <button type="button" class="grid-item" onclick="showModal('Yazılı Ortalamaları', 'Örnek ortalama: 94.50 (uydurma sayı).')">
                    <div class="icon-box"><i class="fa-solid fa-chart-line"></i></div>
                    <span>Yazılı Ortalamaları</span>
                </button>
                <button type="button" class="grid-item" onclick="showModal('Yıl Sonu Notları', 'Örnek metin: Geçmiş yıl puanları bu demoda listelenmez.')">
                    <div class="icon-box"><i class="fa-solid fa-award"></i></div>
                    <span>Yıl Sonu Notları</span>
                </button>
            </div>

            <div class="card-list">
                <button type="button" class="list-item" onclick="showModal('DİLİM', 'Örnek yüzdelik dilim: %2.15 (sahte).')">
                    <div class="list-left">
                        <div class="list-icon"><i class="fa-regular fa-id-card"></i></div>
                        <span>DİLİM</span>
                    </div>
                    <i class="fa-solid fa-chevron-right chevron"></i>
                </button>
            </div>

            <div class="card-list">
                <button type="button" class="list-item" onclick="showModal('Okul Randevu', 'Örnek: Aktif randevu yok.')">
                    <div class="list-left">
                        <div class="list-icon"><i class="fa-regular fa-calendar-plus"></i></div>
                        <span>Okul Randevu</span>
                    </div>
                    <i class="fa-solid fa-chevron-right chevron"></i>
                </button>
                <button type="button" class="list-item" onclick="showModal('Ders Devamsızlıkları', 'Örnek: Ders bazlı devamsızlık yok.')">
                    <div class="list-left">
                        <div class="list-icon"><i class="fa-solid fa-table-cells"></i></div>
                        <span>Ders Devamsızlıkları</span>
                    </div>
                    <i class="fa-solid fa-chevron-right chevron"></i>
                </button>
                <button type="button" class="list-item" onclick="showModal('Nakil Bilgileri', 'Örnek: Nakil başvurusu yok.')">
                    <div class="list-left">
                        <div class="list-icon"><i class="fa-solid fa-location-dot"></i></div>
                        <span>Nakil Bilgileri</span>
                    </div>
                    <i class="fa-solid fa-chevron-right chevron"></i>
                </button>
                <button type="button" class="list-item" onclick="showModal('Sorumluluk Bilgileri', 'Örnek: Sorumlu ders yok.')">
                    <div class="list-left">
                        <div class="list-icon"><i class="fa-solid fa-file-pen"></i></div>
                        <span>Sorumluluk Bilgileri</span>
                    </div>
                    <i class="fa-solid fa-chevron-right chevron"></i>
                </button>
                <button type="button" class="list-item" onclick="showModal('Aldığı Belgeler', 'Örnek belge: Takdir (uydurma dönem).')">
                    <div class="list-left">
                        <div class="list-icon"><i class="fa-solid fa-certificate"></i></div>
                        <span>Aldığı Belgeler</span>
                    </div>
                    <i class="fa-solid fa-chevron-right chevron"></i>
                </button>
            </div>

            <a class="back-link" href="index.html"><i class="fa-solid fa-arrow-left"></i> droolbonded portala dön</a>
        </div>
    </div>

    <div id="infoModal" class="modal" onclick="if(event.target===this)closeModal()">
        <div class="modal-content">
            <button type="button" class="close-btn" onclick="closeModal()" aria-label="Kapat"><i class="fa-solid fa-xmark"></i></button>
            <h3 id="modalTitle" style="margin-bottom: 10px;">Bilgi</h3>
            <div id="modalBody"></div>
            <p class="fake-note">Tüm sayılar ve metinler ödev içindir; gerçek öğrenci kaydı değildir.</p>
        </div>
    </div>

    <script>
        function showGradeModal() {
            document.getElementById('modalTitle').innerText = 'Örnek 1. dönem notları';
            document.getElementById('modalBody').innerHTML = `
                <table class="grade-table">
                    <thead>
                        <tr>
                            <th>Ders</th>
                            <th>1. Sınav</th>
                            <th>2. Sınav</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td>Fizik</td><td>85</td><td>90</td></tr>
                        <tr><td>Kimya</td><td>92</td><td>95</td></tr>
                        <tr><td>Biyoloji</td><td>88</td><td>94</td></tr>
                        <tr><td>Coğrafya</td><td>95</td><td>100</td></tr>
                        <tr><td>Nesne Tabanlı Prog.</td><td>100</td><td>100</td></tr>
                    </tbody>
                </table>
            `;
            document.getElementById('infoModal').style.display = 'flex';
        }

        function showModal(title, text) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerHTML = `<p style="padding: 10px 0;">${text}</p>`;
            document.getElementById('infoModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('infoModal').style.display = 'none';
        }

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
